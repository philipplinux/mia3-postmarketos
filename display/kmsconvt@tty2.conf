# /etc/systemd/system/kmsconvt@tty2.service.d/mia3.conf
# GPU terminal on tty2 (Nerd Font prompt), autologin like tty1. Reached via the power key.
# libseat finds no backend here, so kmscon does its own VT handling. kmscon 10 is DRM-only (no fbdev
# backend, draws nothing), so the fbdev touch keyboard and tty strip can't show on top of it;
# --no-mouse: touches don't turn into a pointer. Tap the top strip area to leave tty2.
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon --vt=%I --no-switchvt --no-libseat --no-mouse --font-name="JetBrainsMono Nerd Font Mono" --font-size=24 --login -- /bin/su -l philipp
