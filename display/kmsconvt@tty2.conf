# /etc/systemd/system/kmsconvt@tty2.service.d/mia3.conf
# GPU terminal on tty2 (Nerd Font prompt), autologin like tty1. Reached via the power key.
# libseat finds no backend here, so kmscon does its own VT handling. --no-drm: draws on fbdev, so buffyboard
# (touch keyboard, also fbdev) shows on top; --no-mouse: touches no longer turn into a pointer.
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon --vt=%I --no-switchvt --no-libseat --no-drm --no-mouse --font-name="JetBrainsMono Nerd Font Mono" --font-size=24 --login -- /bin/su -l philipp
