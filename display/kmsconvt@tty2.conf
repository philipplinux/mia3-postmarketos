# /etc/systemd/system/kmsconvt@tty2.service.d/mia3.conf
# GPU terminal on tty2 (Nerd Font prompt), autologin like tty1. Reached via the power key.
# libseat finds no backend here, so kmscon does its own VT handling.
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon --vt=%I --no-switchvt --no-libseat --font-name="JetBrainsMono Nerd Font Mono" --font-size=24 --login -- /bin/su -l philipp
