# ~/.config/foot/foot.ini for the tty5 sway terminal
font=JetBrainsMono Nerd Font Mono:size=7
pad=4x2
[scrollback]
lines=5000
[key-bindings]
# volume keys scroll (mia3-display only grabs them while the dashboard is shown)
scrollback-up-half-page=XF86AudioRaiseVolume
scrollback-down-half-page=XF86AudioLowerVolume
