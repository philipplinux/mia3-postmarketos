# ~/.config/foot/foot.ini for the tty5 sway terminal
font=JetBrainsMono Nerd Font Mono:size=7
pad=4x2
[scrollback]
lines=5000
[key-bindings]
# volume keys scroll, like the tmux consoles on tty2-4
scrollback-up-half-page=Shift+Page_Up XF86AudioRaiseVolume
scrollback-down-half-page=Shift+Page_Down XF86AudioLowerVolume
