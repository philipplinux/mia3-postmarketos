# ~/.config/tmux/console.conf: tmux on the phone's consoles (tty1-4), only for scrollback (fbcon has none).
# The display maps volume up/down to F11/F12 in the terminal view: half a page up/down; scrolling past the end leaves.
# two blank status lines on top: the panel's rounded corners cut off the first text row
set -g status 2
set -g status-position top
set -g status-style bg=default
set -g status-format[0] ''
set -g status-format[1] ''
set -g history-limit 5000
set -s escape-time 10
set-environment -g STARSHIP_CONFIG /home/philipp/.config/starship-plain.toml   # still the console font: no Nerd glyphs
bind -n F11 { copy-mode -e; send -X halfpage-up }
bind -n F12 refresh-client
bind -T copy-mode F11 send -X halfpage-up
bind -T copy-mode F12 send -X halfpage-down-and-cancel
bind -T copy-mode-vi F11 send -X halfpage-up                  # vi table is used when $EDITOR is vi-like
bind -T copy-mode-vi F12 send -X halfpage-down-and-cancel
